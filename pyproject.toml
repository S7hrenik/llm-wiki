[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki"
version = "0.1.0"
description = "LLM-powered markdown knowledge base CLI — knowledge synthesized at ingest time, not query time."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Shrenik Purvant", email = "S7hrenik@gmail.com" }]
keywords = ["llm", "knowledge-base", "cli", "rag", "claude", "anthropic", "wiki"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.25.0",
    "rich>=13.0.0",
]

[project.scripts]
llm-wiki = "agent:main"

[project.urls]
Homepage = "https://github.com/S7hrenik/llm-wiki"
Repository = "https://github.com/S7hrenik/llm-wiki"
Issues = "https://github.com/S7hrenik/llm-wiki/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["agent.py", "CLAUDE.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
